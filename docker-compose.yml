services:
  mongodb:
    image: mongo:latest
    container_name: flores-mongodb
    restart: unless-stopped
    command: mongod --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-flores_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-flores_dolly_mongo_pass_2026}
      MONGO_INITDB_DATABASE: floresbydolly
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: flores-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      # Conectar el backend a MongoDB usando autenticación obligatoria
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-flores_admin}:${MONGO_ROOT_PASSWORD:-flores_dolly_mongo_pass_2026}@mongodb:27017/floresbydolly?authSource=admin
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  whatsapp-bot:
    build: ./whatsapp-bot
    container_name: flores-whatsapp-bot
    restart: unless-stopped
    shm_size: '1gb'
    user: "1000:1000"
    volumes:
      # Persistencia de la sesión de WhatsApp
      - ./whatsapp-bot/auth_session:/usr/src/app/.wwebjs_auth

  frontend:
    build: ./frontend
    container_name: flores-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flores-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

volumes:
  mongodb_data:
