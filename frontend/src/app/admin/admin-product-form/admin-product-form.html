<div class="product-form">
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-{{ isEdit ? 'edit' : 'plus-circle' }} me-2"></i>
            {{ isEdit ? 'Editar Producto' : 'Nuevo Producto' }}
        </h1>
        <a routerLink="/admin/productos" class="btn-back">
            <i class="fas fa-arrow-left me-1"></i> Volver
        </a>
    </div>

    @if (error) {
    <div class="alert alert-danger">
        <i class="fas fa-exclamation-circle me-2"></i> {{ error }}
    </div>
    }

    <form (ngSubmit)="onSubmit()" class="section-card">
        <div class="row">
            <!-- Left Column -->
            <div class="col-lg-8">
                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-control" [(ngModel)]="product.name" name="name"
                        placeholder="Ej: Astromelias" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción *</label>
                    <textarea class="form-control" [(ngModel)]="product.description" name="description" rows="3"
                        placeholder="Descripción del producto..."></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="text" class="form-control" [(ngModel)]="product.price" name="price"
                            placeholder="Variable por Temporada" />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría *</label>
                        <select class="form-select" [(ngModel)]="product.category" name="category">
                            <option value="">Selecciona...</option>
                            @for (cat of categories; track cat._id) {
                            <option [value]="cat._id">{{ cat.name }}</option>
                            }
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Detalles / Beneficios <small class="text-muted">(uno por línea)</small></label>
                    <textarea class="form-control" [(ngModel)]="featuresText" name="features" rows="4"
                        placeholder="Duración: 10-14 días&#10;Colores: Rosado, Amarillo&#10;Uso: Ramos, Centros de mesa"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Etiquetas de Búsqueda <small class="text-muted">(separadas por coma)</small></label>
                    <input type="text" class="form-control" [(ngModel)]="tagsText" name="tags"
                        placeholder="Duraderas, Coloridas, Versátiles" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Mensaje Predefinido para WhatsApp</label>
                    <textarea class="form-control" [(ngModel)]="product.whatsappMsg" name="whatsappMsg" rows="2"
                        placeholder="Hola! Me interesan las Astromelias..."></textarea>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-4">
                <div class="mb-3">
                    <label class="form-label">Imagen</label>
                    <div class="image-upload" (click)="fileInput.click()">
                        @if (imagePreview) {
                        <img [src]="imagePreview" alt="Preview" class="image-preview" />
                        } @else {
                        <div class="upload-placeholder">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Click para subir imagen</span>
                        </div>
                        }
                    </div>
                    <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Etiqueta Especial <small class="text-muted">(Opcional)</small></label>
                        <input type="text" class="form-control" [(ngModel)]="product.badgeLabel" name="badgeLabel"
                            placeholder="Ej: Más Vendida" />
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Color de Etiqueta</label>
                        <select class="form-select" [(ngModel)]="product.badgeClass" name="badgeClass">
                            <option value="bg-success">Verde</option>
                            <option value="bg-info">Azul Claro</option>
                            <option value="bg-warning text-dark">Amarillo</option>
                            <option value="bg-danger">Rojo</option>
                            <option value="bg-purple">Morado</option>
                        </select>
                    </div>
                </div>

                <div class="form-check form-switch mb-3">
                    <input type="checkbox" class="form-check-input" [(ngModel)]="product.isActive" name="isActive"
                        id="activeSwitch" />
                    <label class="form-check-label" for="activeSwitch">Producto Activo</label>
                </div>
            </div>
        </div>

        <hr />
        <div class="d-flex justify-content-end gap-2">
            <a routerLink="/admin/productos" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-save" [disabled]="saving">
                @if (saving) {
                <span class="spinner-border spinner-border-sm me-1"></span> Guardando...
                } @else {
                <i class="fas fa-save me-1"></i> {{ isEdit ? 'Actualizar' : 'Crear' }} Producto
                }
            </button>
        </div>
    </form>
</div>
