<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-leaf"></i>
            </div>
            <h2>Flores By Dolly</h2>
            <p class="text-muted">Panel de Administración</p>
        </div>

        @if (error) {
        <div class="alert alert-danger d-flex align-items-center">
            <i class="fas fa-exclamation-circle me-2"></i>
            {{ error }}
        </div>
        }

        <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-user me-1"></i> Usuario
                </label>
                <input type="text" class="form-control form-control-lg" [(ngModel)]="username" name="username"
                    placeholder="Ingresa tu usuario" autocomplete="username" [disabled]="loading" />
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-lock me-1"></i> Contraseña
                </label>
                <input type="password" class="form-control form-control-lg" [(ngModel)]="password" name="password"
                    placeholder="Ingresa tu contraseña" autocomplete="current-password" [disabled]="loading" />
            </div>

            <button type="submit" class="btn btn-login w-100" [disabled]="loading">
                @if (loading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                Ingresando...
                } @else {
                <i class="fas fa-sign-in-alt me-2"></i>
                Iniciar Sesión
                }
            </button>
        </form>

        <div class="login-footer">
            <a routerLink="/" class="text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i> Volver al sitio
            </a>
        </div>
    </div>
</div>
