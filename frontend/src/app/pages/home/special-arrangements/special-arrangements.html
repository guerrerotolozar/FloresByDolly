<section class="arreglos-especiales py-5">
    <div class="container">
        <div class="text-center mb-5" data-aos="fade-up">
            <h2 class="title-flores mb-3">Arreglos Especiales</h2>
            <p class="lead text-muted">Momentos únicos merecen flores únicas</p>
        </div>

        <!-- Grid de 6 tarjetas -->
        <div class="arrangements-grid">
            @for (arreglo of arreglos; track arreglo.nombre; let i = $index) {
            <div class="product-card" data-aos="fade-up" [attr.data-aos-delay]="100 + i * 80"
                 (click)="goToCatalog()" style="cursor: pointer;">
                <!-- Imagen cuadrada 1:1 -->
                <div class="card-image-wrapper">
                    <img [src]="arreglo.imagen"
                         [alt]="arreglo.nombre"
                         width="1080" height="1080"
                         loading="lazy">
                    <span class="card-badge" [ngClass]="arreglo.badgeClass">{{ arreglo.badge }}</span>
                </div>

                <!-- Contenido -->
                <div class="card-body">
                    <h3 class="card-title">{{ arreglo.nombre }}</h3>
                    <p class="card-desc">{{ arreglo.descripcion }}</p>

                    <!-- Lista de confianza -->
                    <ul class="trust-list">
                        <li><i class="fas fa-check-circle"></i> Tarjeta personalizada</li>
                        <li><i class="fas fa-check-circle"></i> Foto antes de entrega</li>
                        <li><i class="fas fa-check-circle"></i> Flores frescas</li>
                    </ul>
                </div>
            </div>
            }
        </div>
    </div>
</section>
